[package]
name = "pentimento-webview"
autoexamples = false
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
cef = ["dep:cef", "dep:urlencoding"]
dioxus = ["dep:pentimento-dioxus-ui"]

[dependencies]
pentimento-ipc = { path = "../ipc" }
pentimento-frontend-core = { path = "../frontend-core" }

tokio = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
image = { workspace = true }
thiserror = { workspace = true }
raw-window-handle = { workspace = true }

# CEF (Chromium Embedded Framework) bindings - optional dependency for cef feature
cef = { workspace = true, optional = true }
urlencoding = { version = "2.1", optional = true }

# Dioxus (native Rust UI) - optional dependency for dioxus feature
pentimento-dioxus-ui = { path = "../dioxus-ui", optional = true }

# Capture example and WebKit dependencies belong to legacy/webview.
[package.metadata]
legacy-manifest = "../../legacy/webview/Cargo.toml"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("webkit"))'] }
