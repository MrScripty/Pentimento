[package]
name = "pentimento-dioxus-ui"
version.workspace = true
edition.workspace = true

[features]
default = []
hot-reload = ["dep:dioxus-devtools"]

[dependencies]
pentimento-ipc = { path = "../ipc" }
pentimento-frontend-core = { path = "../frontend-core" }
dioxus = { workspace = true, features = ["document"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

# Bevy for render world integration
bevy = { workspace = true }

# Vello for GPU rendering - accessed via Bevy's shared wgpu device
vello = { workspace = true }

# Re-export wgpu types for the renderer interface
wgpu = "27"

# Keep this Blitz cohort together: AnyRender 0.7 / Vello 0.7 / wgpu 27.
# This historical development snapshot predates the upstream wgpu 28 migration.
# See docs/dioxus-dependency-compatibility.md before updating it.
blitz-dom = { git = "https://github.com/DioxusLabs/blitz.git", rev = "f83b2bc049aae41275b248e8709586a0b267591e" }
blitz-paint = { git = "https://github.com/DioxusLabs/blitz.git", rev = "f83b2bc049aae41275b248e8709586a0b267591e" }
blitz-traits = { git = "https://github.com/DioxusLabs/blitz.git", rev = "f83b2bc049aae41275b248e8709586a0b267591e" }
dioxus-native-dom = { git = "https://github.com/DioxusLabs/blitz.git", rev = "f83b2bc049aae41275b248e8709586a0b267591e" }

# AnyRender - the 2D drawing abstraction
anyrender = "0.7"
anyrender_vello = "0.7"

# Layout (used by blitz-dom)
taffy = "0.9"

# Curve/path types
peniko = "0.6"
kurbo = "0.13"
keyboard-types = "0.7"

# Asset loading and document support (matching official Bevy example)
dioxus-asset-resolver = { git = "https://github.com/DioxusLabs/dioxus.git", branch = "main", features = ["native"] }
dioxus-devtools = { git = "https://github.com/DioxusLabs/dioxus.git", branch = "main", optional = true }
crossbeam-channel = "0.5"
data-url = "0.3"
bytes = "1.0"
