[package]
name = "sctk-adwaita"
version = "0.10.1"
edition = "2021"
authors = ["Poly <marynczak.bartlomiej@gmail.com>"]
keywords = ["sctk"]
license = "MIT AND MPL-2.0 AND OFL-1.1"
repository = "https://github.com/PolyMeilex/sctk-adwaita"
documentation = "https://docs.rs/sctk-adwaita"
description = "Adwaita-like SCTK Frame"

[dependencies]
log = "0.4"
memmap2 = { version = "0.9.0", optional = true }
tiny-skia = { version = "0.11", default-features = false, features = [
  "std",
  "simd",
] }
smithay-client-toolkit = { version = "0.19.0", default-features = false }

# Draw title text using crossfont `--features crossfont`
crossfont = { version = "0.8.0", optional = true }
# Maintained title parser; keep the historical feature as a compatibility alias.
skrifa = { version = "=0.44.0", optional = true }

[features]
default = ["ab_glyph"]
crossfont = ["dep:crossfont"]
ab_glyph = ["skrifa"]
skrifa = ["dep:skrifa", "memmap2"]

# Test this bounded fork separately without enrolling it as a workspace member.
[workspace]
