[package]
workspace = "../legacy"
name = "pentimento-tauri"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pentimento Tauri desktop app (Bevy WASM + Svelte)"

[dependencies]
# This patched stable cohort is selected together; do not independently float
# the implementation and runtime traits. See legacy/README.md.
# Enumerate the historical defaults to avoid adding the newer dbus default.
tauri = { version = "=2.11.6", default-features = false, features = [
    "wry", "compression", "common-controls-v6", "dynamic-acl", "x11", "devtools",
] }
tauri-runtime = "=2.11.3"
tauri-runtime-wry = { version = "=2.11.4", default-features = false }
# Macro expansions are host APIs too; the 2.7 helpers target Tauri 2.12.
tauri-macros = { version = "=2.6.3", default-features = false }
tauri-plugin-shell = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
pentimento-ipc = { path = "../crates/ipc" }

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }
# Constrain the same official 2.11.6 build/macro helper cohort when regenerating.
tauri-codegen = { version = "=2.6.3", default-features = false }
tauri-utils = { version = "=2.9.3", default-features = false }
tauri-plugin = { version = "=2.6.3", default-features = false }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "pentimento_tauri_lib"
crate-type = ["lib", "cdylib", "staticlib"]
path = "src/lib.rs"
