name: Electron runtime qualification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  electron-runtime:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src-electron/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install Linux runtime prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgtk-3-dev libudev-dev libwayland-dev libwebkit2gtk-4.1-dev libxkbcommon-dev pkg-config xvfb libnss3 libgbm1
          cargo install wasm-bindgen-cli
      - name: Install and verify binary readiness without changing locks
        run: |
          sha256sum package-lock.json src-electron/package-lock.json > "$RUNNER_TEMP/electron-locks.sha256"
          ./launcher.sh --install
          node src-electron/check-install.cjs
          ./launcher.sh --install
          sha256sum --check "$RUNNER_TEMP/electron-locks.sha256"
          node --test tests/contracts/electron-bootstrap.test.mjs tests/contracts/electron-render.test.mjs
          python3 tests/electron/test_supervise.py
      - name: Audit complete runtime and tooling graphs
        run: |
          mkdir -p electron-runtime-evidence
          npm audit --json > electron-runtime-evidence/root-audit.json
          npm --prefix src-electron audit --json > electron-runtime-evidence/electron-audit.json
      - name: Check ordinary Linux renderer sandbox
        run: env -u ELECTRON_RUN_AS_NODE -u VITE_DEV_SERVER_URL xvfb-run -a python3 tests/electron/supervise.py environment ./src-electron/node_modules/electron/dist/electron tests/electron/runtime-smoke.cjs --preflight
      - name: Build genuine production UI and Bevy WASM
        run: ./launcher.sh --build --frontend electron
      - name: Qualify production rendering and shutdown
        run: |
          env -u ELECTRON_RUN_AS_NODE -u VITE_DEV_SERVER_URL xvfb-run -a python3 tests/electron/supervise.py production ./src-electron/node_modules/electron/dist/electron tests/electron/runtime-smoke.cjs
          sha256sum --check "$RUNNER_TEMP/electron-locks.sha256"
      - name: Preserve runtime qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electron-runtime-evidence
          path: electron-runtime-evidence/
          if-no-files-found: warn
          retention-days: 7
