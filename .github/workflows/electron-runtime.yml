name: Electron runtime qualification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  electron-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      PENTIMENTO_CI_ELECTRON: /usr/lib/pentimento-ci/electron-44.5.1/electron
    steps:
      - uses: actions/checkout@v4
      - name: Report protected runtime ancestor metadata
        run: stat -c '%n uid=%u gid=%g mode=%a type=%F' / /opt /usr /usr/lib
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src-electron/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install Linux runtime prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgtk-3-dev libudev-dev libwayland-dev libwebkit2gtk-4.1-dev libxkbcommon-dev pkg-config xvfb libnss3 libgbm1
          cargo install wasm-bindgen-cli
      - name: Install and verify binary readiness without changing locks
        run: |
          sha256sum package-lock.json src-electron/package-lock.json > "$RUNNER_TEMP/electron-locks.sha256"
          ./launcher.sh --install
          node src-electron/check-install.cjs
          ./launcher.sh --install
          sha256sum --check "$RUNNER_TEMP/electron-locks.sha256"
          node --test tests/contracts/electron-bootstrap.test.mjs tests/contracts/electron-render.test.mjs
          python3 tests/electron/test_supervise.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/electron/test_provision_ci_runtime.py
      - name: Audit complete runtime and tooling graphs
        run: |
          mkdir -p electron-runtime-evidence
          npm audit --json > electron-runtime-evidence/root-audit.json
          npm --prefix src-electron audit --json > electron-runtime-evidence/electron-audit.json
      - name: Provision verified official runtime and Linux sandbox helper
        timeout-minutes: 6
        run: |
          test "$(id -u)" -ne 0
          PYTHONDONTWRITEBYTECODE=1 python3 tests/electron/provision_ci_runtime.py --evidence "$RUNNER_TEMP/electron-sandbox-provision.json"
      - name: Check ordinary Linux renderer sandbox
        run: env -u ELECTRON_RUN_AS_NODE -u VITE_DEV_SERVER_URL xvfb-run -a python3 tests/electron/supervise.py environment "$PENTIMENTO_CI_ELECTRON" tests/electron/runtime-smoke.cjs --preflight
      - name: Build genuine production UI and Bevy WASM
        run: ./launcher.sh --build --frontend electron
      # Explicit software WebGL opt-in for trusted local CI content only.
      # The ordinary sandbox preflight above uses no graphics overrides.
      - name: Qualify production rendering and shutdown
        run: |
          env -u ELECTRON_RUN_AS_NODE -u VITE_DEV_SERVER_URL xvfb-run -a python3 tests/electron/supervise.py production "$PENTIMENTO_CI_ELECTRON" --use-gl=angle --use-angle=swiftshader-webgl --enable-unsafe-swiftshader tests/electron/runtime-smoke.cjs
          sha256sum --check "$RUNNER_TEMP/electron-locks.sha256"
      - name: Preserve runtime qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electron-runtime-evidence
          path: |
            electron-runtime-evidence/
            ${{ runner.temp }}/electron-sandbox-provision.json
          if-no-files-found: warn
          retention-days: 7
