name: sculpt-geometry

on:
  push:
    branches: [main]
  pull_request:

jobs:
  geometry:
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test sculpt topology, UV seams, and render-asset sync
        run: ./scripts/test-sculpt-geometry.sh
