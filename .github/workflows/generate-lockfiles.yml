name: Temporary lockfile resolution evidence
on:
  push:
    branches:
      - review/pentimento-lockfile-generation
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Generate review-only lockfiles and evidence
        run: bash .github/scripts/generate-locks.sh
      - name: Preserve evidence even if resolution fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pentimento-lockfile-resolution
          path: lockfile-evidence/
          if-no-files-found: error
          retention-days: 7
