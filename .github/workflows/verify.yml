name: verify

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  active-frontends:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            src-electron/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Linux frontend prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libgtk-3-dev \
            libudev-dev \
            libwayland-dev \
            libwebkit2gtk-4.1-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli

      - name: Install repo dependencies
        run: |
          sha256sum package-lock.json src-electron/package-lock.json > "$RUNNER_TEMP/npm-lockfiles.sha256"
          ./launcher.sh --install
          sha256sum --check "$RUNNER_TEMP/npm-lockfiles.sha256"

      - name: Verify active frontends
        run: ./launcher.sh --test

  sculpting:
    runs-on: ubuntu-24.04
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check normal codec source formatting
        run: rustfmt --edition 2024 --check crates/sculpting/src/types.rs crates/sculpting/src/brush.rs

      - name: Test sculpting library
        run: cargo test -p sculpting --lib

      - name: Lint sculpting library
        run: cargo clippy -p sculpting --lib --tests
