name: paint-sculpt-tools

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine-integration:
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test combined projection, brush, and sculpt engine contracts
        run: ./scripts/test-paint-sculpt-tools.sh --engine-only
