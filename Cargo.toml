[workspace]
resolver = "2"
members = [
    "crates/app",
    "crates/app-wasm",
    "crates/config",
    "crates/scene",
    "crates/webview",
    "crates/ipc",
    "crates/diffusion",
    "crates/cef-helper",
    "crates/dioxus-ui",
    "crates/egui-ui",
    "crates/painting",
    "crates/sculpting",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/puma/pentimento"

[workspace.dependencies]
# Core
bevy = { version = "=0.20.0", default-features = false }
glam = "=0.33.12"
tokio = { version = "1.44", features = ["sync", "rt-multi-thread", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
thiserror = "2.0"
tracing = "0.1"

# Webview
wry = "0.53"
raw-window-handle = "0.6"

# Image handling
image = "0.25"
bytemuck = { version = "1.21", features = ["derive"] }

# Diffusion (optional in crates that use them)
candle-core = "0.8"
candle-nn = "0.8"
candle-transformers = "0.8"

# Networking
tokio-tungstenite = "0.26"
futures-util = "0.3"

# Dioxus (native UI with Blitz WGPU renderer)
dioxus = "0.7"
dioxus-native = "0.7"

# Vello (GPU-accelerated 2D renderer used by Blitz)
# Vello must share Bevy 0.20's wgpu 30 device with the Dioxus adapter.
vello = "=0.11.0"
bevy_egui = "=0.43.0-rc.1"
# Presentation widgets share the plugin's egui version without pulling its renderer.
egui = "=0.36.2"

[workspace.lints.rust]
unsafe_code = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
