[workspace]
resolver = "2"
members = ["app", "webview", "../crates/frontend-webkit", "../crates/frontend-overlay", "../src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/puma/pentimento"

[workspace.dependencies]
bevy = { version = "=0.20.0", default-features = false }
# Wry's native WebKit links must be one cohort for Tauri and retained backends.
wry = "=0.55.1"
raw-window-handle = "0.6"
tokio = { version = "1.44", features = ["sync", "rt-multi-thread", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
thiserror = "2.0"
tracing = "0.1"
image = "0.25"

[profile.release]
lto = true
codegen-units = 1
strip = true
